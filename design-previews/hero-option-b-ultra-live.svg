      <rect x="708" y="0" width="14" height="14"/><rect x="752" y="0" width="14" height="22"/><rect x="796" y="0" width="14" height="14"/><rect x="840" y="0" width="14" height="22"/>
      <rect x="884" y="0" width="14" height="14"/><rect x="928" y="0" width="14" height="22"/><rect x="972" y="0" width="14" height="14"/><rect x="1016" y="0" width="14" height="22"/>
      <rect x="1060" y="0" width="14" height="14"/><rect x="1104" y="0" width="14" height="22"/><rect x="1148" y="0" width="14" height="14"/><rect x="1192" y="0" width="14" height="22"/>
      <rect x="1236" y="0" width="14" height="14"/><rect x="1280" y="0" width="14" height="22"/><rect x="1324" y="0" width="14" height="14"/><rect x="1368" y="0" width="14" height="22"/>
