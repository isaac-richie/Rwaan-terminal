    <text x="620" y="482" class="txt muted small">News</text>
    <text x="710" y="482" class="txt muted small">Geopolitics</text>

    <g transform="translate(0 530)">
      <rect width="310" height="154" rx="14" fill="#303030" stroke="#494949"/><text x="22" y="42" class="txt h3">BTC up or down 5m?</text><text x="260" y="42" class="txt h2">51c</text><rect x="22" y="78" width="126" height="40" rx="8" fill="#444"/><text x="68" y="104" class="txt bold small">LONG</text><rect x="156" y="78" width="126" height="40" rx="8" fill="#444"/><text x="198" y="104" class="txt bold small">SHORT</text><path d="M0 147 C55 124 120 151 188 134 C235 120 260 148 310 128" fill="none" stroke="#e56755" stroke-width="2"/>
      <rect x="330" width="310" height="154" rx="14" fill="#303030" stroke="#494949"/><text x="352" y="42" class="txt h3">Spain World Cup?</text><text x="590" y="42" class="txt h2">18c</text><rect x="352" y="78" width="126" height="40" rx="8" fill="#444"/><text x="398" y="104" class="txt bold small">LONG</text><rect x="486" y="78" width="126" height="40" rx="8" fill="#444"/><text x="528" y="104" class="txt bold small">SHORT</text><path d="M330 147 C380 144 430 146 480 143 C535 138 575 140 640 130" fill="none" stroke="#e56755" stroke-width="2"/>
      <rect x="660" width="310" height="154" rx="14" fill="#303030" stroke="#494949"/><text x="682" y="42" class="txt h3">US-Iran peace deal?</text><text x="920" y="42" class="txt h2">75c</text><rect x="682" y="78" width="126" height="40" rx="8" fill="#444"/><text x="728" y="104" class="txt bold small">LONG</text><rect x="816" y="78" width="126" height="40" rx="8" fill="#444"/><text x="858" y="104" class="txt bold small">SHORT</text><path d="M660 147 C720 132 760 155 820 112 C885 86 910 118 970 95" fill="none" stroke="#e56755" stroke-width="2"/>
      <rect x="990" width="310" height="154" rx="14" fill="#303030" stroke="#494949"/><text x="1012" y="42" class="txt h3">Major AI IPO?</text><text x="1250" y="42" class="txt h2">63c</text><rect x="1012" y="78" width="126" height="40" rx="8" fill="#444"/><text x="1058" y="104" class="txt bold small">LONG</text><rect x="1146" y="78" width="126" height="40" rx="8" fill="#444"/><text x="1188" y="104" class="txt bold small">SHORT</text><path d="M990 147 C1040 142 1080 122 1138 132 C1210 142 1240 114 1300 102" fill="none" stroke="#e56755" stroke-width="2"/>
