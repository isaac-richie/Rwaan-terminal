    <path d="M64 21H64" stroke="#3b3b3b"/>
    <text x="90" y="28" class="txt bold small">Markets</text>
    <text x="165" y="28" class="txt muted small">Portfolio</text>
    <text x="250" y="28" class="txt muted small">Analysis</text>
