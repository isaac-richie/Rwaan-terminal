    <text x="0" y="54" class="txt h3"><tspan class="red">~</tspan> Live</text>
    <rect x="0" y="78" width="650" height="244" rx="16" fill="#303030" stroke="#464646" filter="url(#shadow)"/>
    <g transform="translate(32 110)">
