<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .txt{font-family:Inter,Arial,sans-serif;fill:#f5f5f5;letter-spacing:0}
      .muted{fill:#9a9ca3}.gold{fill:#e8b93f}.green{fill:#74df91}.red{fill:#e56755}
      .small{font-size:18px}.tiny{font-size:14px}.title{font-size:50px;font-weight:900}.h2{font-size:34px;font-weight:900}.h3{font-size:25px;font-weight:850}.bold{font-weight:850}
    </style>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111"/><stop offset="1" stop-color="#242424"/></linearGradient>
    <linearGradient id="promo" x1="0" x2="1"><stop stop-color="#622dff"/><stop offset="0.45" stop-color="#191919"/><stop offset="1" stop-color="#f06522"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
