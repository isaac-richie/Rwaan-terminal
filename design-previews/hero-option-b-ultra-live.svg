      <text x="596" y="126" text-anchor="end" class="txt red tiny">-1.1%</text>
      <circle cx="18" cy="166" r="18" fill="#e2c071"/>
      <text x="52" y="172" class="txt h3">Will Spain win the 2026 FIFA World Cup?</text>
      <text x="596" y="172" text-anchor="end" class="txt h2">18c</text>
      <text x="596" y="200" text-anchor="end" class="txt green tiny">+0.8%</text>
    </g>

    <rect x="690" y="78" width="650" height="244" rx="16" fill="#161616" stroke="#464646" filter="url(#shadow)"/>
    <path d="M690 142 C760 90 800 198 870 168 C950 132 1015 236 1100 196 C1210 142 1260 182 1340 150 L1340 322 L690 322 Z" fill="url(#promo)" opacity="0.9"/>
