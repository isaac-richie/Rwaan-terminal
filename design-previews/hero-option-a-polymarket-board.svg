      <path d="M0 24H420M0 92H420M0 160H420M0 228H420" stroke="#303540" stroke-dasharray="2 6"/>
      <path d="M0 38H120V64H176V38H420" fill="none" stroke="#df4a89" stroke-width="3"/>
      <path d="M0 202H120V176H176V202H420" fill="none" stroke="#e7922e" stroke-width="3"/>
      <circle cx="405" cy="38" r="6" fill="#df4a89"/>
      <circle cx="405" cy="202" r="6" fill="#e7922e"/>
    </g>

    <text x="1018" y="78" class="txt h2">Breaking markets</text>
    <g transform="translate(1018 116)">
      <text x="0" y="0" class="txt muted small">1</text>
      <text x="34" y="0" class="txt small bold">Will Trump attend his son's wedding?</text>
      <text x="386" y="0" class="txt h3">3%</text>
      <text x="386" y="26" class="txt red tiny">down 64%</text>
      <text x="0" y="70" class="txt muted small">2</text>
      <text x="34" y="70" class="txt small bold">Will James Garner be included in squad?</text>
      <text x="386" y="70" class="txt h3">10%</text>
      <text x="386" y="96" class="txt red tiny">down 33%</text>
      <text x="0" y="140" class="txt muted small">3</text>
      <text x="34" y="140" class="txt small bold">Will D.K. Metcalf be traded?</text>
      <text x="386" y="140" class="txt h3">25%</text>
      <text x="386" y="166" class="txt green tiny">up 25%</text>
      <path d="M0 206H420" stroke="#282d37"/>
      <text x="0" y="250" class="txt h2">Hot topics</text>
      <text x="0" y="292" class="txt muted small">1</text><text x="34" y="292" class="txt small bold">BTC</text><text x="300" y="292" class="txt muted small">$34M today</text>
      <text x="0" y="334" class="txt muted small">2</text><text x="34" y="334" class="txt small bold">World Cup</text><text x="300" y="334" class="txt muted small">$11M today</text>
    </g>
