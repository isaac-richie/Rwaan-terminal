    <text x="72" y="50" class="txt muted small">Crypto</text>
    <text x="165" y="50" class="txt muted small">Sports</text>
    <text x="255" y="50" class="txt muted small">News</text>
    <text x="330" y="50" class="txt muted small">Geopolitics</text>
