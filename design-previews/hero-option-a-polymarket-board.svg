<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0b0d11"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#1a1d22"/>
      <stop offset="1" stop-color="#111419"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .txt{font-family:Inter,Arial,sans-serif;fill:#f5f5f5;letter-spacing:0}
      .muted{fill:#8e949f}
      .gold{fill:#e8b93f}
      .green{fill:#6ee795}
      .red{fill:#ff6574}
      .small{font-size:18px}
      .tiny{font-size:14px}
      .title{font-size:38px;font-weight:800}
      .h2{font-size:30px;font-weight:800}
      .h3{font-size:22px;font-weight:800}
      .bold{font-weight:800}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="250" cy="40" r="280" fill="#e8b93f" opacity="0.08"/>
  <circle cx="1320" cy="150" r="260" fill="#214cff" opacity="0.08"/>

  <g transform="translate(70 34)">
    <path d="M0 56 H1460" stroke="#242832"/>
    <g transform="translate(0 0)">
      <path d="M0 34 C18 4 42 4 58 34 C74 64 98 64 116 34" fill="none" stroke="#7d37ff" stroke-width="13" stroke-linecap="round"/>
      <path d="M0 34 C18 64 42 64 58 34 C74 4 98 4 116 34" fill="none" stroke="#15b8ff" stroke-width="13" stroke-linecap="round" opacity="0.75"/>
      <text x="142" y="24" class="txt bold" font-size="22">Rawli <tspan class="gold">Analytic</tspan></text>
      <text x="142" y="43" class="txt muted tiny" letter-spacing="3">PREDICTION TERMINAL</text>
    </g>
    <text x="420" y="34" class="txt muted small">Markets</text>
    <text x="500" y="34" class="txt muted small">Portfolio</text>
    <rect x="680" y="8" width="390" height="44" rx="12" fill="#12161d" stroke="#252a35"/>
    <text x="708" y="36" class="txt muted small">Search markets, teams, crypto...</text>
    <rect x="1110" y="9" width="86" height="42" rx="12" fill="#111a14" stroke="#1f4028"/>
    <text x="1130" y="36" class="txt green tiny">Live</text>
    <rect x="1214" y="9" width="106" height="42" rx="12" fill="#12161d" stroke="#252a35"/>
    <text x="1236" y="36" class="txt muted tiny">BNB Chain</text>
    <rect x="1340" y="7" width="120" height="46" rx="13" fill="#e8b93f"/>
    <text x="1366" y="37" class="txt bold tiny" fill="#08090c">Connect</text>
