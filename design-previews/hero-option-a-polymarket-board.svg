    <rect x="222" y="274" width="180" height="50" rx="10" fill="#252b33"/>
    <text x="284" y="306" class="txt muted small">NYK +2.5</text>
    <text x="28" y="365" class="txt h3">Total</text>
    <text x="278" y="365" class="txt h3">204.5</text>
    <rect x="28" y="386" width="180" height="50" rx="10" fill="#252b33"/>
