      <rect width="350" height="130" rx="14" fill="#191d23" stroke="#2b303a"/>
      <text x="22" y="40" class="txt small bold">BTC Up or Down 5m?</text><text x="270" y="42" class="txt h3">51¢</text>
      <rect x="22" y="72" width="140" height="38" rx="8" fill="#143523"/><text x="78" y="97" class="txt green small bold">Up</text>
      <rect x="172" y="72" width="140" height="38" rx="8" fill="#3a1a22"/><text x="222" y="97" class="txt red small bold">Down</text>
      <rect x="370" width="350" height="130" rx="14" fill="#191d23" stroke="#2b303a"/>
      <text x="392" y="40" class="txt small bold">Will Spain win 2026 World Cup?</text><text x="640" y="42" class="txt h3">18¢</text>
      <text x="392" y="103" class="txt muted small">$1B Vol.</text>
      <rect x="740" width="350" height="130" rx="14" fill="#191d23" stroke="#2b303a"/>
      <text x="762" y="40" class="txt small bold">US-Iran permanent peace deal?</text><text x="1010" y="42" class="txt h3">75¢</text>
      <text x="762" y="103" class="txt muted small">$151M Vol.</text>
      <rect x="1110" width="350" height="130" rx="14" fill="#191d23" stroke="#2b303a"/>
      <text x="1132" y="40" class="txt small bold">Major AI IPO this month?</text><text x="1390" y="42" class="txt h3">63¢</text>
      <text x="1132" y="103" class="txt muted small">$8.6M Vol.</text>
    </g>
  </g>
</svg>
